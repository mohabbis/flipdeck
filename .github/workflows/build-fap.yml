name: Build .fap

on:
  push:
    branches: [master]
    paths: ["src/**", "application.fam", "assets/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache uFBT SDK
        uses: actions/cache@v4
        with:
          path: ~/.ufbt
          key: ufbt-sdk-${{ runner.os }}-${{ hashFiles('application.fam') }}
          restore-keys: ufbt-sdk-${{ runner.os }}-
      - name: Build .fap
        run: pip install ufbt && ufbt
      - name: Commit .fap
        run: |
          cp dist/flipdeck.fap web/public/flipdeck.fap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/flipdeck.fap
          git diff --cached --quiet && exit 0
          git commit -m "build: rebuild flipdeck.fap"

          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after rebasing."
            sleep 5
          done

          echo "Failed to push rebuilt .fap after 3 attempts."
          exit 1
